[project]
name = "people-mosaic"
version = "0.1.0"
description = "Local video face masking with a Finder Quick Action"
requires-python = ">=3.12"
dependencies = [
    "av>=16,<17",
    "certifi>=2025.8",
    "numpy>=2.2,<3",
    "opencv-python-headless>=4.12,<5",
    "Pillow>=11.3,<13",
    "pyside6==6.10.2",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.scripts]
people-mosaic = "people_mosaic.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/people_mosaic"]

[dependency-groups]
bundle = [
    "cmake>=3.31,<4",
    "cython>=3.1,<4",
    "ninja>=1.13,<2",
    "scikit-build>=0.18,<1",
    "wheel>=0.45,<1",
]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
    "pip-audit>=2.9,<3",
    "pyinstaller==6.22.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
